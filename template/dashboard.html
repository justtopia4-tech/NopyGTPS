<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growtopia Player Support</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <link rel="shortcut icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link rel="icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: rgba(0, 0, 0, 0.0) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.25) !important;
    }

    .modal-backdrop+div {
      overflow: auto;
    }

    /* Modal Dialog & Container sizing - compact & responsive */
    .modal {
      text-align: center;
      padding: 0 !important;
    }

    .modal:before {
      content: '';
      display: inline-block;
      height: 100%;
      vertical-align: middle;
      margin-right: -4px;
    }

    .modal-dialog {
      display: inline-block;
      text-align: left;
      vertical-align: middle;
      width: 92% !important;
      max-width: 420px !important;
      margin: 10px auto !important;
    }

    /* Animated Rotating Living Border for Dashboard */
    .product-list-popup .modal-content {
      position: relative !important;
      overflow: hidden !important;
      border-radius: 12px !important;
      border: none !important;
      background: transparent !important;
      box-shadow: 0 0 25px rgba(0, 184, 255, 0.45), 0 10px 30px rgba(0, 0, 0, 0.7) !important;
      padding: 3px !important; /* Ketebalan garis tepi berputar */
    }

    .product-list-popup .modal-content::before {
      content: '' !important;
      position: absolute !important;
      top: -50% !important;
      left: -50% !important;
      width: 200% !important;
      height: 200% !important;
      background: conic-gradient(
        transparent 0deg,
        transparent 40deg,
        #00b8ff 90deg,
        #38bdf8 135deg,
        #27fd04 180deg,
        #38bdf8 225deg,
        #00b8ff 270deg,
        transparent 320deg,
        transparent 360deg
      ) !important;
      animation: rotateBorder 4s linear infinite !important;
      z-index: 0 !important;
    }

    .product-list-popup .modal-content .modal-body {
      position: relative !important;
      z-index: 1 !important;
      background: rgba(18, 48, 77, 0.96) !important;
      border-radius: 9px !important;
      padding: 16px 12px !important;
      width: 100% !important;
      max-width: 100% !important;
    }

    @keyframes rotateBorder {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .content,
    .common-box,
    .container {
      background: transparent !important;
      width: 100% !important;
      max-width: 100% !important;
      padding-left: 6px !important;
      padding-right: 6px !important;
    }

    .div-content-center {
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 auto !important;
    }

    .div-content-center > div {
      width: 100% !important;
      padding: 0 !important;
    }

    #loginForm,
    #registerForm {
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 auto !important;
    }

    .section-title {
      margin-bottom: 8px !important;
      padding-bottom: 0 !important;
    }

    .section-title h2 {
      font-size: 18px !important;
      margin: 6px 0 !important;
      letter-spacing: 0.5px;
    }

    /* Compact Form Inputs - exactly equal width with buttons */
    .form-group {
      width: 100% !important;
      margin-bottom: 8px !important;
      padding: 0 !important;
    }

    .grow-text,
    .form-control.grow-text {
      width: 100% !important;
      max-width: 100% !important;
      display: block !important;
      box-sizing: border-box !important;
      height: 38px !important;
      font-size: 13px !important;
      padding: 6px 12px !important;
      border-radius: 5px !important;
      margin: 0 auto !important;
    }

    /* Server Name Input - green text */
    #login-server,
    #reg-server {
      color: #27FD04 !important;
      font-weight: bold;
    }

    #login-server::placeholder,
    #reg-server::placeholder {
      color: #88B8CB !important;
      font-weight: normal;
    }

    .password-wrapper {
      position: relative;
      width: 100% !important;
      max-width: 100% !important;
      display: block !important;
      box-sizing: border-box !important;
    }

    .password-wrapper input.grow-text {
      width: 100% !important;
      max-width: 100% !important;
      padding-right: 48px !important;
      box-sizing: border-box !important;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      color: #888;
      user-select: none;
    }

    .toggle-password:hover {
      color: #333;
    }

    /* Compact Grow Buttons - exactly equal width with inputs */
    .grow-button,
    .btn.grow-button {
      width: 100% !important;
      max-width: 100% !important;
      display: block !important;
      box-sizing: border-box !important;
      font-size: 13px !important;
      padding: 8px 12px !important;
      margin: 2px auto 0 auto !important;
      white-space: normal !important;
      line-height: 1.25 !important;
    }

    .credit {
      text-align: center;
      padding: 6px 0 2px 0;
      font-size: 10px;
      color: #888;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      margin-top: 8px;
    }

    .credit a {
      color: #888;
      text-decoration: none;
    }

    .credit a:hover {
      color: #5bc0de;
    }

    /* Extra compact for smaller mobile screens and landscape mode */
    @media (max-width: 480px), (max-height: 500px) {
      .modal-dialog {
        max-width: 370px !important;
        width: 92% !important;
        margin: 8px auto !important;
      }

      .product-list-popup .modal-content .modal-body {
        padding: 12px 8px !important;
      }

      .section-title h2 {
        font-size: 16px !important;
        margin: 4px 0 !important;
      }

      .form-group {
        margin-bottom: 6px !important;
      }

      .grow-text,
      .form-control.grow-text {
        height: 35px !important;
        font-size: 12px !important;
        padding: 5px 10px !important;
      }

      .grow-button,
      .btn.grow-button {
        font-size: 12px !important;
        padding: 7px 10px !important;
      }

      .credit {
        font-size: 9px !important;
        margin-top: 6px !important;
        padding-top: 4px !important;
      }
    }
  </style>
</head>

<body style="background-color: rgba(0,0,0,0.0);">
  <button type="button" class="btn btn-primary hidden" data-toggle="modal" id="modalButton" data-target="#modalShow"
    data-backdrop="static" data-keyboard="false"></button>
  <div class="content">
    <section class="common-box ">
      <div class="container">
        <div class="row">
          <div class="col-md-12 col-sm-12">
            <div class="row">
              <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
                <div class="modal-dialog modal-dialog-centered" role="document">
                  <div class="modal-content">
                    <div class="modal-body">
                      <div class="content">
                        <section class="common-box ">
                          <div class="container">
                            <div class="section-title center-align">
                              <h2 id="pageTitle">LOGIN</h2>
                            </div>
                            <div class="row div-content-center">
                              <div class="col-md-12 col-sm-12">

                                <!-- Form 1: Login Form -->
                                <form method="POST" id="loginForm" action="/player/growid/login/validate"
                                  accept-charset="UTF-8" class="" role="form" autocomplete="off">
                                  <input name="_token" type="hidden" value="{{ data }}">

                                  <!-- Server Name Input -->
                                  <div class="form-group">
                                    <input id="login-server" class="form-control grow-text" required="required"
                                      placeholder="Your Server Name *" name="server" value="{{ defaultServer }}" type="text"
                                      autocomplete="off">
                                  </div>

                                  <!-- GrowID Input -->
                                  <div class="form-group">
                                    <input id="login-name" class="form-control grow-text" required="required"
                                      placeholder="Your GrowID Name *" name="growId" value="" type="text"
                                      pattern="[A-Za-z0-9#]+" title="Only letters and numbers are allowed"
                                      autocomplete="off">
                                  </div>

                                  <!-- Password Input with SHOW/HIDE toggle -->
                                  <div class="form-group">
                                    <div class="password-wrapper">
                                      <input id="password" class="form-control grow-text" required="required"
                                        placeholder="Your GrowID Password *" name="password" type="password" value=""
                                        pattern="[A-Za-z0-9@._!\-#]+"
                                        title="Only letters, numbers, and @ . _ ! - are allowed"
                                        autocomplete="off">
                                      <span class="toggle-password" onclick="togglePassword('password', this)">SHOW</span>
                                    </div>
                                  </div>

                                  <div class="form-group text-center">
                                    <input class="btn btn-lg btn-primary grow-button" type="submit" value="Login">
                                  </div>

                                  <div class="form-group text-center">
                                    <button type="button" class="btn btn-lg btn-primary grow-button" id="openRegisterBtn">
                                      Don't have any GTPSID? Register here!
                                    </button>
                                  </div>
                                </form>

                                <!-- Form 2: Register Form (Menu Regist) -->
                                <form method="POST" id="registerForm" action="/player/growid/login/validate"
                                  accept-charset="UTF-8" class="" role="form" autocomplete="off" style="display: none;">
                                  <input name="_token" type="hidden" value="{{ data }}">
                                  <input name="email" id="reg-email" type="hidden" value="">

                                  <!-- Server Name Input -->
                                  <div class="form-group">
                                    <input id="reg-server" class="form-control grow-text" required="required"
                                      placeholder="Your Server Name *" name="server" value="{{ defaultServer }}" type="text"
                                      autocomplete="off">
                                  </div>

                                  <!-- Register GrowID Input -->
                                  <div class="form-group">
                                    <input id="reg-name" class="form-control grow-text" required="required"
                                      placeholder="Create GrowID Name *" name="growId" value="" type="text"
                                      pattern="[A-Za-z0-9#]+" title="Only letters and numbers are allowed"
                                      autocomplete="off">
                                  </div>

                                  <!-- Register Password Input -->
                                  <div class="form-group">
                                    <div class="password-wrapper">
                                      <input id="reg-password" class="form-control grow-text" required="required"
                                        placeholder="Create Password *" name="password" type="password" value=""
                                        pattern="[A-Za-z0-9@._!\-#]+"
                                        title="Only letters, numbers, and @ . _ ! - are allowed"
                                        autocomplete="off">
                                      <span class="toggle-password" onclick="togglePassword('reg-password', this)">SHOW</span>
                                    </div>
                                  </div>

                                  <div class="form-group text-center">
                                    <input class="btn btn-lg btn-primary grow-button" type="submit" id="submitRegBtn" value="Create account">
                                  </div>

                                  <div class="form-group text-center">
                                    <button type="button" class="btn btn-lg btn-primary grow-button" id="openLoginBtn">
                                      Already have an account? Log in here!
                                    </button>
                                  </div>
                                </form>

                                <div class="credit">
                                  (C) <a href="#">@NopyGTPS</a>
                                </div>
                              </div>
                            </div>
                          </div>
                        </section>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>
  <script>
    let clicked = false;
    $("a").click(function () { if (clicked === false) { clicked = true; return true; } $(this).attr("onclick", "return false;"); });
    $('document').ready(function () {
      document.onkeydown = (e) => {
        if (e.key == 123) {
          e.preventDefault();
        }
        if (e.key == 'F12') {
          e.preventDefault();
        }
        if (e.ctrlKey && e.shiftKey && e.key == 'I') {
          e.preventDefault();
        }
        if (e.ctrlKey && e.key == 'I') {
          e.preventDefault();
        }
        if (e.ctrlKey && e.shiftKey && e.key == 'C') {
          e.preventDefault();
        }
        if (e.ctrlKey && e.shiftKey && e.key == 'J') {
          e.preventDefault();
        }
        if (e.ctrlKey && e.key == 'U') {
          e.preventDefault();
        }
      };
      $('#modalButton').trigger('click');
    });

    function togglePassword(inputId, toggleEl) {
      var passInput = document.getElementById(inputId);
      if (!passInput) return;
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleEl.innerHTML = 'HIDE';
      } else {
        passInput.type = 'password';
        toggleEl.innerHTML = 'SHOW';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const openRegisterBtn = document.getElementById('openRegisterBtn');
      const openLoginBtn = document.getElementById('openLoginBtn');
      const pageTitle = document.getElementById('pageTitle');

      const loginServer = document.getElementById('login-server');
      const loginName = document.getElementById('login-name');
      const loginPass = document.getElementById('password');

      const regServer = document.getElementById('reg-server');
      const regName = document.getElementById('reg-name');
      const regPass = document.getElementById('reg-password');
      const regEmail = document.getElementById('reg-email');

      // Input character sanitization
      [loginName, regName].forEach(function(el) {
        if (el) {
          el.addEventListener('input', function() {
            this.value = this.value.replace(/[^A-Za-z0-9#]/g, '');
          });
        }
      });

      [loginPass, regPass].forEach(function(el) {
        if (el) {
          el.addEventListener('input', function() {
            this.value = this.value.replace(/[^A-Za-z0-9@._!\-#]/g, '');
          });
        }
      });

      // Switch to Register Menu
      if (openRegisterBtn) {
        openRegisterBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (loginServer && regServer && loginServer.value) {
            regServer.value = loginServer.value;
          }
          if (loginName && regName && loginName.value) {
            regName.value = loginName.value;
          }
          if (loginPass && regPass && loginPass.value) {
            regPass.value = loginPass.value;
          }
          loginForm.style.display = 'none';
          registerForm.style.display = 'block';
          pageTitle.textContent = 'REGISTER';
          if (regPass && !regPass.value && regName && regName.value) {
            regPass.focus();
          } else if (regName) {
            regName.focus();
          }
        });
      }

      // Switch back to Login Menu
      if (openLoginBtn) {
        openLoginBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (regServer && loginServer && regServer.value) {
            loginServer.value = regServer.value;
          }
          if (regName && loginName && regName.value) {
            loginName.value = regName.value;
          }
          if (regPass && loginPass && regPass.value) {
            loginPass.value = regPass.value;
          }
          registerForm.style.display = 'none';
          loginForm.style.display = 'block';
          pageTitle.textContent = 'LOGIN';
          if (loginName) {
            loginName.focus();
          }
        });
      }

      // Handle Register Form Submission
      if (registerForm) {
        registerForm.addEventListener('submit', function(e) {
          if (regServer && !regServer.value.trim()) {
            regServer.focus();
            e.preventDefault();
            return false;
          }
          if (regName && !regName.value.trim()) {
            regName.focus();
            e.preventDefault();
            return false;
          }
          if (regPass && !regPass.value) {
            regPass.focus();
            e.preventDefault();
            return false;
          }

          // Set email to trigger reg=1 in backend
          regEmail.value = (regName.value.trim() || 'user').toLowerCase() + '@gtps.com';

          const submitRegBtn = document.getElementById('submitRegBtn');
          if (submitRegBtn) {
            submitRegBtn.disabled = true;
            submitRegBtn.value = 'Creating account...';
          }
        });
      }
    });
  </script>
</body>

</html>
