<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growtopia Login</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <link rel="shortcut icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Minimal Reset & Base Styles -->
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #f8fafc;
    }

    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.75) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-dialog {
      max-width: 400px;
      margin: 40px auto;
    }

    /* Minimalist Dark Slate Card */
    .gt-card {
      position: relative;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }



    /* Header */
    .gt-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .gt-logo {
      width: 42px;
      height: 42px;
      margin: 0 auto 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      color: #60a5fa;
    }

    .gt-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.3px;
    }

    .gt-subtitle {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    /* Form Switcher Tabs */
    .gt-tabs {
      display: flex;
      background: #1e293b;
      padding: 3px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
    }

    .gt-tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      font-size: 13px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .gt-tab-btn.active {
      color: #ffffff;
      background: #3b82f6;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
      font-weight: 700;
    }

    /* Form Input Fields */
    .gt-input-group {
      position: relative;
      margin-bottom: 14px;
    }

    .gt-input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      width: 18px;
      height: 18px;
      transition: color 0.2s ease;
      pointer-events: none;
    }

    .gt-input {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 42px;
      background: #1e293b !important;
      border: 1px solid #334155 !important;
      border-radius: 10px !important;
      color: #ffffff !important;
      font-size: 13.5px !important;
      font-weight: 500;
      transition: all 0.2s ease !important;
      outline: none !important;
      box-shadow: none !important;
    }

    .gt-input::placeholder {
      color: #64748b;
      font-weight: 400;
    }

    .gt-input:focus {
      border-color: #3b82f6 !important;
      background: #1e293b !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
    }

    .gt-input-group:focus-within .gt-input-icon {
      color: #60a5fa;
    }

    /* Eye toggle for password */
    .gt-password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s ease;
    }

    .gt-password-toggle:hover {
      color: #60a5fa;
    }

    /* Primary Submit Button */
    .gt-btn-primary {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      border: none;
      background: #3b82f6;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .gt-btn-primary:hover {
      background: #2563eb;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
    }

    .gt-btn-primary:active {
      transform: translateY(1px);
    }

    .gt-btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Footer Links */
    .gt-form-footer {
      text-align: center;
      margin-top: 14px;
      font-size: 12.5px;
      color: #64748b;
    }

    .gt-link {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .gt-link:hover {
      color: #93c5fd;
      text-decoration: underline;
    }

    /* Utility classes */
    .form-container {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .hidden {
      display: none !important;
      opacity: 0;
    }
  </style>
</head>

<body>

  <button type="button" class="btn btn-primary hidden" data-toggle="modal" id="modalButton" data-target="#modalShow"
    data-backdrop="static" data-keyboard="false"></button>

  <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="gt-card">
        


        <!-- Header -->
        <div class="gt-header">
          <div class="gt-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11c0 2.473.345 4.866.99 7.132" />
            </svg>
          </div>
          <h2 class="gt-title" id="pageTitle">Log In</h2>
          <div class="gt-subtitle" id="pageSubtitle">Enter your Growtopia account details</div>
        </div>

        <!-- Form Switcher Tabs -->
        <div class="gt-tabs">
          <button type="button" class="gt-tab-btn active" id="tabLogin">Log In</button>
          <button type="button" class="gt-tab-btn" id="tabRegister">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <form method="POST" id="loginForm" action="/player/growid/login/validate" accept-charset="UTF-8" role="form" autocomplete="off" class="form-container">
          <input name="_token" type="hidden" value="{{ data }}">
          
          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input id="login-name" class="gt-input grow-text" required="required" placeholder="GrowID *" name="growId" value="" type="text" pattern="[A-Za-z0-9]+" title="Only letters and numbers allowed">
          </div>

          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input id="password" class="gt-input grow-text" required="required" placeholder="Password *" name="password" type="password" value="" pattern="[A-Za-z0-9@._!\-]+" title="Allowed characters: letters, numbers, @ . _ ! -">
            <button type="button" class="gt-password-toggle" onclick="togglePasswordVisibility('password', this)">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>

          <button class="gt-btn-primary grow-button" type="submit" id="loginSubmitBtn">
            <span>Log In</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>

          <div class="gt-form-footer">
            Need an account? <a href="#" id="toggleRegister" class="gt-link">Register</a>
          </div>
        </form>

        <!-- REGISTER FORM -->
        <form method="POST" id="registerForm" action="/player/growid/login/validate" accept-charset="UTF-8" class="form-container hidden" role="form" autocomplete="off">
          <input name="_token" type="hidden" value="{{ data }}">

          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input id="register-name" class="gt-input grow-text" required="required" placeholder="Choose GrowID *" name="growId" value="" type="text" pattern="[A-Za-z0-9]+" title="Only letters and numbers allowed">
          </div>

          <input type="hidden" id="register-email" name="email" value="user@gtps.com">

          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input id="register-password" class="gt-input grow-text" required="required" placeholder="Password *" name="password" type="password" value="" pattern="[A-Za-z0-9@._!\-]+" title="Allowed characters: letters, numbers, @ . _ ! -">
            <button type="button" class="gt-password-toggle" onclick="togglePasswordVisibility('register-password', this)">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>

          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
            <input id="register-confirm-password" class="gt-input grow-text" required="required" placeholder="Confirm Password *" name="password_confirmation" type="password" value="" pattern="[A-Za-z0-9@._!\-]+" title="Allowed characters: letters, numbers, @ . _ ! -">
          </div>

          <button class="gt-btn-primary grow-button" type="submit" id="registerSubmitBtn">
            <span>Create Account</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>

          <div class="gt-form-footer">
            Already registered? <a href="#" id="toggleLogin" class="gt-link">Log In</a>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- JQUERY & BOOTSTRAP LIBRARIES (For GT Webview Modal integration) -->
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>

  <script>
    // Password visibility toggle function
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      
      btn.innerHTML = isPassword ? 
        `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 013.682-.823c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-1.39-1.39a3 3 0 00-4.243-4.243M3 3l18 18" />
        </svg>` : 
        `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>`;
    }

    document.addEventListener('DOMContentLoaded', function () {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const toggleRegister = document.getElementById('toggleRegister');
      const toggleLogin = document.getElementById('toggleLogin');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const pageTitle = document.getElementById('pageTitle');
      const pageSubtitle = document.getElementById('pageSubtitle');

      function showLogin() {
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        pageTitle.textContent = 'Log In';
        pageSubtitle.textContent = 'Enter your Growtopia account details';
      }

      function showRegister() {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        pageTitle.textContent = 'Create Account';
        pageSubtitle.textContent = 'Register a new account for GTPS';
      }

      // Tab clicks
      tabLogin.addEventListener('click', showLogin);
      tabRegister.addEventListener('click', showRegister);

      // Link toggles
      toggleRegister.addEventListener('click', function (e) {
        e.preventDefault();
        showRegister();
      });

      toggleLogin.addEventListener('click', function (e) {
        e.preventDefault();
        showLogin();
      });

      // Login form handlers
      const loginSubmitButton = document.getElementById('loginSubmitBtn');
      const loginNameInput = document.getElementById('login-name');
      const passwordInput = document.getElementById('password');

      loginNameInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
      });

      passwordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
      });

      loginForm.addEventListener('submit', function (e) {
        if (loginSubmitButton.disabled) {
          e.preventDefault();
          return false;
        }
        loginSubmitButton.disabled = true;
        loginSubmitButton.querySelector('span').textContent = 'Logging in...';
      });

      // Register form handlers
      const registerSubmitButton = document.getElementById('registerSubmitBtn');
      const registerNameInput = document.getElementById('register-name');
      const registerEmailInput = document.getElementById('register-email');
      const registerPasswordInput = document.getElementById('register-password');
      const registerConfirmPasswordInput = document.getElementById('register-confirm-password');

      registerNameInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
      });

      registerPasswordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
      });

      registerConfirmPasswordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
      });

      registerForm.addEventListener('submit', function (e) {
        if (registerSubmitButton.disabled) {
          e.preventDefault();
          return false;
        }

        if (registerPasswordInput.value !== registerConfirmPasswordInput.value) {
          e.preventDefault();
          alert('Passwords do not match!');
          return false;
        }

        registerEmailInput.value = (registerNameInput.value || 'user').toLowerCase() + '@gtps.com';
        registerSubmitButton.disabled = true;
        registerSubmitButton.querySelector('span').textContent = 'Registering...';
      });
    });

    // In-game inspection block & modal auto-trigger
    $('document').ready(function () {
      document.onkeydown = (e) => {
        if (e.key == 123 || e.key == 'F12') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && (e.key == 'I' || e.key == 'C' || e.key == 'J')) e.preventDefault();
        if (e.ctrlKey && (e.key == 'U' || e.key == 'I')) e.preventDefault();
      };

      $('#modalButton').trigger('click');
      $('.close').on('click', function () {
        window.location = "https://login.growtopiagame.com/player/validate/close";
      });

      // Observer for screen scaling (< 667px)
      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          for (var i = 0; i < mutation.addedNodes.length; i++) {
            if (mutation.addedNodes[i].tagName == 'DIV') {
              var thediv = mutation.addedNodes[i];
              var sw = window.screen.width;
              if (sw < 667) {
                $(thediv).css({
                  'transform': 'scale(0.85)',
                  'transform-origin': '50% 50%',
                  '-webkit-transform': 'scale(0.85)',
                  '-webkit-transform-origin': '50% 50%',
                  'overflow': 'auto'
                });
              }
            }
          }
        });
      });
      observer.observe(document.body, { attributes: false, childList: true, characterData: false });
    });
  </script>
</body>
</html>
