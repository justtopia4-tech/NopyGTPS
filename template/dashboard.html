<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growtopia Login</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <link rel="shortcut icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link rel="icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap & Game CSS -->
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: rgba(0, 0, 0, 0.0) !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .modal-backdrop {
      background-color: rgba(6, 11, 25, 0.75) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-dialog {
      max-width: 440px;
      margin: 30px auto;
    }

    /* Glassmorphism Card Container */
    .gt-card {
      position: relative;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                  0 0 40px rgba(0, 230, 118, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      color: #f8fafc;
    }

    /* Ambient background glow particles inside card */
    .gt-card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(0, 230, 118, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .gt-card::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: -60px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(0, 176, 255, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Close Button */
    .gt-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .gt-close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #ef4444;
      transform: rotate(90deg);
    }

    /* Header Styling */
    .gt-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .gt-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.25);
      color: #00e676;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .gt-badge img {
      width: 16px;
      height: 16px;
    }

    .gt-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .gt-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* Form Switcher Tabs */
    .gt-tabs {
      display: flex;
      background: rgba(30, 41, 59, 0.6);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
      position: relative;
    }

    .gt-tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 600;
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 1;
      text-align: center;
    }

    .gt-tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
      font-weight: 700;
    }

    /* Form Input Fields */
    .gt-input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .gt-input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      width: 18px;
      height: 18px;
      transition: color 0.2s ease;
      pointer-events: none;
    }

    .gt-input {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 44px;
      background: rgba(30, 41, 59, 0.7) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 12px !important;
      color: #ffffff !important;
      font-size: 14px !important;
      font-weight: 500;
      transition: all 0.25s ease !important;
      box-shadow: none !important;
    }

    .gt-input::placeholder {
      color: #64748b;
      font-weight: 400;
    }

    .gt-input:focus {
      border-color: #00e676 !important;
      background: rgba(30, 41, 59, 0.9) !important;
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.25) !important;
      outline: none !important;
    }

    .gt-input-group:focus-within .gt-input-icon {
      color: #00e676;
    }

    /* Eye toggle for password */
    .gt-password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .gt-password-toggle:hover {
      color: #00e676;
    }

    /* Primary Submit Button */
    .gt-btn-primary {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
      color: #09131d;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0, 230, 118, 0.35);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .gt-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 230, 118, 0.5);
      color: #000000;
    }

    .gt-btn-primary:active {
      transform: translateY(0);
    }

    .gt-btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Links Footer */
    .gt-form-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
    }

    .gt-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .gt-link:hover {
      color: #00e676;
      text-decoration: underline;
    }

    /* Form Transitions */
    .form-container {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .hidden {
      display: none !important;
      opacity: 0;
      transform: translateY(10px);
    }

    /* Scale adjustment for low res */
    @media (max-height: 600px) {
      .gt-card {
        padding: 20px 22px;
      }
      .gt-header {
        margin-bottom: 16px;
      }
      .gt-input-group {
        margin-bottom: 12px;
      }
      .gt-input {
        height: 42px;
      }
      .gt-btn-primary {
        height: 44px;
      }
    }
  </style>
</head>

<body style="background-color: rgba(0,0,0,0.0);">

  <button type="button" class="btn btn-primary hidden" data-toggle="modal" id="modalButton" data-target="#modalShow"
    data-backdrop="static" data-keyboard="false"></button>

  <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="gt-card">
        
        <!-- Modal Close Button -->
        <button type="button" class="gt-close-btn close" aria-label="Close">&times;</button>

        <!-- Header -->
        <div class="gt-header">
          <h2 class="gt-title" id="pageTitle">Log in with Grow ID</h2>
          <div class="gt-subtitle" id="pageSubtitle">Enter your credentials to connect to GTPS</div>
        </div>

        <!-- Form Switcher Tabs -->
        <div class="gt-tabs">
          <button type="button" class="gt-tab-btn active" id="tabLogin">Log In</button>
          <button type="button" class="gt-tab-btn" id="tabRegister">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <form method="POST" id="loginForm" action="/player/growid/login/validate" accept-charset="UTF-8" role="form" autocomplete="off" class="form-container">
          <input name="_token" type="hidden" value="{{ data }}">
          
          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input id="login-name" class="gt-input grow-text" required="required" placeholder="Growtopia Name *" name="growId" value="" type="text" pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
          </div>

          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input id="password" class="gt-input grow-text" required="required" placeholder="Growtopia Password *" name="password" type="password" value="" pattern="[A-Za-z0-9@._!\-]+" title="Only letters, numbers, and @ . _ ! - are allowed">
            <button type="button" class="gt-password-toggle" onclick="togglePasswordVisibility('password', this)">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>

          <button class="gt-btn-primary grow-button" type="submit" id="loginSubmitBtn">
            <span>Log In to Account</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>

          <div class="gt-form-footer">
            <span style="color: #64748b; font-size: 12px; display: inline-block;">Need an account? <a href="#" id="toggleRegister" class="gt-link">Register here</a></span>
          </div>
        </form>

        <!-- REGISTER FORM -->
        <form method="POST" id="registerForm" action="/player/growid/login/validate" accept-charset="UTF-8" class="form-container hidden" role="form" autocomplete="off">
          <input name="_token" type="hidden" value="{{ data }}">

          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <input id="register-name" class="gt-input grow-text" required="required" placeholder="Choose Grow Name *" name="growId" value="" type="text" pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
          </div>

          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <input id="register-email" class="gt-input grow-text" required="required" placeholder="Email Address *" name="email" value="" type="email">
          </div>

          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input id="register-password" class="gt-input grow-text" required="required" placeholder="Password *" name="password" type="password" value="" pattern="[A-Za-z0-9@._!\-]+" title="Only letters, numbers, and @ . _ ! - are allowed">
            <button type="button" class="gt-password-toggle" onclick="togglePasswordVisibility('register-password', this)">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>

          <div class="gt-input-group">
            <svg class="gt-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
            <input id="register-confirm-password" class="gt-input grow-text" required="required" placeholder="Confirm Password *" name="password_confirmation" type="password" value="" pattern="[A-Za-z0-9@._!\-]+" title="Only letters, numbers, and @ . _ ! - are allowed">
          </div>

          <button class="gt-btn-primary grow-button" type="submit" id="registerSubmitBtn">
            <span>Create Account</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>

          <div class="gt-form-footer">
            <span style="color: #64748b; font-size: 12px;">Already registered? <a href="#" id="toggleLogin" class="gt-link">Back to Log in</a></span>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- JQUERY & BOOTSTRAP LIBRARY -->
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>

  <script>
    // Password visibility toggle function
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      
      btn.innerHTML = isPassword ? 
        `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 013.682-.823c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-1.39-1.39a3 3 0 00-4.243-4.243M3 3l18 18" />
        </svg>` : 
        `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>`;
    }

    document.addEventListener('DOMContentLoaded', function () {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const toggleRegister = document.getElementById('toggleRegister');
      const toggleLogin = document.getElementById('toggleLogin');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const pageTitle = document.getElementById('pageTitle');
      const pageSubtitle = document.getElementById('pageSubtitle');

      function showLogin() {
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        pageTitle.textContent = 'Log in with Grow ID';
        pageSubtitle.textContent = 'Enter your credentials to connect to GTPS';
      }

      function showRegister() {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        pageTitle.textContent = 'Register Grow ID';
        pageSubtitle.textContent = 'Create a new account to join GTPS';
      }

      // Tab clicks
      tabLogin.addEventListener('click', showLogin);
      tabRegister.addEventListener('click', showRegister);

      // Link toggles
      toggleRegister.addEventListener('click', function (e) {
        e.preventDefault();
        showRegister();
      });

      toggleLogin.addEventListener('click', function (e) {
        e.preventDefault();
        showLogin();
      });

      // Login form handlers
      const loginSubmitButton = document.getElementById('loginSubmitBtn');
      const loginNameInput = document.getElementById('login-name');
      const passwordInput = document.getElementById('password');

      loginNameInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
      });

      passwordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
      });

      loginForm.addEventListener('submit', function (e) {
        if (loginSubmitButton.disabled) {
          e.preventDefault();
          return false;
        }
        loginSubmitButton.disabled = true;
        loginSubmitButton.querySelector('span').textContent = 'Logging in...';
      });

      // Register form handlers
      const registerSubmitButton = document.getElementById('registerSubmitBtn');
      const registerNameInput = document.getElementById('register-name');
      const registerEmailInput = document.getElementById('register-email');
      const registerPasswordInput = document.getElementById('register-password');
      const registerConfirmPasswordInput = document.getElementById('register-confirm-password');

      registerNameInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
      });

      registerPasswordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
      });

      registerConfirmPasswordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
      });

      registerForm.addEventListener('submit', function (e) {
        if (registerSubmitButton.disabled) {
          e.preventDefault();
          return false;
        }

        if (registerPasswordInput.value !== registerConfirmPasswordInput.value) {
          e.preventDefault();
          alert('Passwords do not match!');
          return false;
        }

        registerSubmitButton.disabled = true;
        registerSubmitButton.querySelector('span').textContent = 'Registering...';
      });
    });

    // In-game inspection block & modal auto-trigger
    $('document').ready(function () {
      document.onkeydown = (e) => {
        if (e.key == 123 || e.key == 'F12') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && (e.key == 'I' || e.key == 'C' || e.key == 'J')) e.preventDefault();
        if (e.ctrlKey && (e.key == 'U' || e.key == 'I')) e.preventDefault();
      };

      $('#modalButton').trigger('click');
      $('.close').on('click', function () {
        window.location = "https://login.growtopiagame.com/player/validate/close";
      });

      // Observer for screen scaling (< 667px)
      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          for (var i = 0; i < mutation.addedNodes.length; i++) {
            if (mutation.addedNodes[i].tagName == 'DIV') {
              var thediv = mutation.addedNodes[i];
              var sw = window.screen.width;
              if (sw < 667) {
                $(thediv).css({
                  'transform': 'scale(0.85)',
                  'transform-origin': '50% 50%',
                  '-webkit-transform': 'scale(0.85)',
                  '-webkit-transform-origin': '50% 50%',
                  'overflow': 'auto'
                });
              }
            }
          }
        });
      });
      observer.observe(document.body, { attributes: false, childList: true, characterData: false });
    });
  </script>
