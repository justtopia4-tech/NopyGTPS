<!DOCTYPE html>
<html lang="en" style="background-color: transparent; width:100%; height: 100%;">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magical Private Server - Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/animated-logo.svg">
  <link rel="shortcut icon" href="/animated-logo.svg" type="image/svg+xml">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: transparent !important;
      background-color: transparent !important;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      color: #f0f4fc;
    }

    /* Glassmorphism Dashboard Card (GTPS Webview Format) */
    .login-card {
      position: relative;
      z-index: 10;
      width: 240px;
      max-width: 94vw;
      padding: 10px 12px 10px 12px;
      border-radius: 13px;
      background: rgba(18, 24, 44, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 100, 0.3);
      box-shadow: 
        0 8px 25px rgba(0, 0, 0, 0.6),
        0 0 16px rgba(255, 200, 50, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      color: #f0f4fc;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Image Banner Inside Card Border (Box Container) */
    .banner-container {
      width: 100%;
      height: 80px;
      border-radius: 9px;
      overflow: hidden;
      margin-bottom: 6px;
      border: 1px solid rgba(255, 215, 100, 0.35);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4), 0 0 8px rgba(255, 215, 0, 0.18);
      position: relative;
      background: rgba(10, 14, 28, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.4s ease;
    }

    .banner-container:hover .banner-img {
      transform: scale(1.04);
    }

    /* Title Styling */
    h2 {
      text-align: center;
      font-family: 'Outfit', sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ffe885 50%, #ffc83b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 1px 8px rgba(255, 200, 0, 0.2);
    }

    .title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 4px;
    }

    label {
      display: block;
      font-size: 0.54rem;
      font-weight: 700;
      color: rgba(255, 235, 180, 0.85);
      margin-bottom: 1px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .input-icon {
      position: relative;
    }

    .input-icon svg:not(.toggle-pw) {
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 11px;
      height: 11px;
      color: rgba(255, 215, 100, 0.65);
      pointer-events: none;
      transition: color 0.25s ease, filter 0.25s ease;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 5px 6px 5px 22px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 215, 100, 0.18);
      border-radius: 5px;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.70rem;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder,
    input[type="email"]::placeholder {
      color: rgba(220, 230, 250, 0.35);
      font-size: 0.68rem;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus {
      border-color: rgba(255, 215, 0, 0.7);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 0 8px rgba(255, 215, 0, 0.2),
        inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .input-icon:focus-within svg:not(.toggle-pw) {
      color: #ffd700;
      filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.8));
    }

    .toggle-pw {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 11px;
      height: 11px;
      pointer-events: auto;
      cursor: pointer;
      color: rgba(255, 215, 100, 0.5);
      transition: all 0.2s ease;
    }

    .toggle-pw:hover {
      color: #ffd700;
      filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.8));
    }

    /* Main Submit Button */
    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      padding: 6px 8px;
      margin-top: 5px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
      border: 1px solid rgba(255, 235, 150, 0.4);
      border-radius: 5px;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    .btn-icon:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-icon:active {
      transform: translateY(0);
      box-shadow: 0 1px 5px rgba(217, 119, 6, 0.4);
    }

    .btn-icon:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Secondary / Ghost Button */
    .ghost-btn {
      width: 100%;
      padding: 4px 6px;
      margin-top: 3px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 215, 100, 0.2);
      border-radius: 5px;
      color: #fce7f3;
      font-family: 'Outfit', sans-serif;
      font-size: 0.64rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: none;
    }

    .ghost-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 215, 100, 0.1);
      border-color: rgba(255, 215, 100, 0.4);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(255, 215, 0, 0.15);
    }

    .ghost-btn:active {
      transform: translateY(0);
    }

    .hidden { display: none !important; }

    /* Footer text */
    .server-footer {
      margin-top: 4px;
      text-align: center;
      font-size: 0.50rem;
      color: rgba(255, 235, 200, 0.45);
      letter-spacing: 0.05em;
    }

    .modal-backdrop { display: none !important; }
  </style>
</head>

    <div class="form-wrapper">
      <!-- LOGIN FORM -->
      <form method="POST" id="loginForm" action="/player/growid/login/validate" accept-charset="UTF-8" role="form" autocomplete="off">
        <input name="_token" type="hidden" value="{{ data }}">
        
        <div class="form-group">
          <label for="login-name">Growtopia Name</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="login-name" required
              placeholder="Enter GrowID Name" name="growId" type="text"
              pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="password" required
              placeholder="Enter Password" name="password" type="password"
              pattern="[A-Za-z0-9@._!\-#$]+"
              title="Only letters, numbers, and @ . _ ! - # $ are allowed">
            <svg class="toggle-pw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="button" tabindex="0">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <button type="submit" class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Log In
        </button>

        <button type="button" id="toggleRegister" class="ghost-btn">
          ✨ Register New Account
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form method="POST" id="registerForm" action="/player/growid/login/validate"
        accept-charset="UTF-8" class="hidden" role="form" autocomplete="off">
        <input name="_token" type="hidden" value="{{ data }}">
        
        <div class="form-group">
          <label for="register-name">Growtopia Name</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="register-name" required
              placeholder="Desired GrowID Name" name="growId" type="text"
              pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
          </div>
        </div>

        <div class="form-group">
          <label for="register-email">Email Address</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input id="register-email" required
              placeholder="Your Email" name="email" type="email">
          </div>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="register-password" required
              placeholder="Create Password" name="password" type="password"
              pattern="[A-Za-z0-9@._!\-#$]+"
              title="Only letters, numbers, and @ . _ ! - # $ are allowed">
            <svg class="toggle-pw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="button" tabindex="0">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label for="register-confirm-password">Confirm Password</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <input id="register-confirm-password" required
              placeholder="Confirm Password" name="password_confirmation" type="password"
              pattern="[A-Za-z0-9@._!\-#$]+"
              title="Only letters, numbers, and @ . _ ! - # $ are allowed">
            <svg class="toggle-pw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="button" tabindex="0">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <button type="submit" class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          Register Account
        </button>

        <button type="button" id="toggleLogin" class="ghost-btn">
          ← Back to Login
        </button>
      </form>
    </div>

    <div class="server-footer">
      MAGICAL PS &bull; Player Support System
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const toggleRegister = document.getElementById('toggleRegister');
      const toggleLogin = document.getElementById('toggleLogin');
      const sectionTitle = document.getElementById('sectionTitle');
      const loginSubmitButton = loginForm.querySelector('button[type="submit"]');
      const loginNameInput = document.getElementById('login-name');
      const passwordInput = document.getElementById('password');

      let registerAutoSubmitting = false;

      const buildAutoRegisterForm = () => {
        const tokenInput = loginForm.querySelector('input[name="_token"]');
        const tokenValue = tokenInput ? tokenInput.value : '';

        const autoForm = document.createElement('form');
        autoForm.method = 'POST';
        autoForm.action = '/player/growid/login/validate';
        autoForm.acceptCharset = 'UTF-8';
        autoForm.autocomplete = 'off';
        autoForm.style.display = 'none';

        autoForm.innerHTML = `
          <input name="_token" type="hidden" value="${tokenValue}">
          <input name="growId" type="hidden" value="">
          <input name="password" type="hidden" value="">
          <input name="email" type="hidden" value="">
          <input name="password_confirmation" type="hidden" value="">
        `;

        document.body.appendChild(autoForm);
        return autoForm;
      };

      toggleRegister.addEventListener('click', function (e) {
        e.preventDefault();
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        sectionTitle.innerHTML = '<span class="title-icon">REGISTER NEW ACCOUNT</span>';
      });

      toggleLogin.addEventListener('click', function (e) {
        e.preventDefault();
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        sectionTitle.innerHTML = '<span class="title-icon">MAGICAL PRIVATE SERVER</span>';
      });

      loginNameInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
      });

      passwordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
      });

      loginForm.addEventListener('submit', function (e) {
        if (loginSubmitButton.disabled) {
          e.preventDefault();
          return false;
        }
        loginSubmitButton.disabled = true;
        loginSubmitButton.textContent = 'Logging in...';
      });

      const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      const eyeClosed = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

      document.querySelectorAll('.toggle-pw').forEach(function (btn) {
        const input = btn.previousElementSibling;
        btn.addEventListener('click', function () {
          if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = eyeClosed;
          } else {
            input.type = 'password';
            btn.innerHTML = eyeOpen;
          }
        });
      });

      const registerSubmitButton = registerForm.querySelector('button[type="submit"]');
      const registerNameInput = document.getElementById('register-name');
      const registerPasswordInput = document.getElementById('register-password');
      const registerConfirmPasswordInput = document.getElementById('register-confirm-password');

      if (registerNameInput) {
        registerNameInput.addEventListener('input', function () {
          this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
        });
      }

      if (registerPasswordInput) {
        registerPasswordInput.addEventListener('input', function () {
          this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
        });
      }

      if (registerConfirmPasswordInput) {
        registerConfirmPasswordInput.addEventListener('input', function () {
          this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
        });
      }

      if (registerForm) {
        registerForm.addEventListener('submit', function (e) {
          if (registerAutoSubmitting) return;

          if (registerSubmitButton && registerSubmitButton.disabled) {
            e.preventDefault();
            return false;
          }

          if (
            registerPasswordInput &&
            registerConfirmPasswordInput &&
            registerPasswordInput.value !== registerConfirmPasswordInput.value
          ) {
            e.preventDefault();
            alert('Passwords do not match!');
            return false;
          }

          if (registerSubmitButton) {
            registerSubmitButton.disabled = true;
            registerSubmitButton.textContent = 'Registering...';
          }
        });
      }
    });
  </script>

  <script>
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12') e.preventDefault();
      if (e.ctrlKey && e.shiftKey && e.key === 'I') e.preventDefault();
      if (e.ctrlKey && e.shiftKey && e.key === 'J') e.preventDefault();
      if (e.ctrlKey && e.key === 'U') e.preventDefault();
    });
  </script>
</body>
</html>
